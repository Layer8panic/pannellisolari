<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulatore impianti solari termici</title>
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#1d2433;--muted:#5f6878;--line:#e3ddcf;--sun:#f5a524;--hot:#e0482f;--cold:#2f7fd8;--ok:#1f9d63;--bad:#d23c3c;--accent:#16325c;--accent2:#2a5aa0;--soft:#eef3fb;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--accent);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.hbar{display:flex;align-items:center;gap:10px;padding:9px 14px;max-width:1180px;margin:0 auto}
.hbar h1{font-size:15.5px;margin:0;line-height:1.2;font-weight:650}
.hbar small{display:block;opacity:.75;font-weight:400;font-size:12px}
.hbar .home{white-space:nowrap;flex:none;margin-left:auto;background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:6px 11px;cursor:pointer}
.pills{display:flex;gap:6px;overflow-x:auto;padding:0 14px 9px;max-width:1180px;margin:0 auto;scrollbar-width:none}
.pills button{flex:none;border:0;border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;background:rgba(255,255,255,.12);color:#dfe7f5;white-space:nowrap}
.pills button.cur{background:var(--sun);color:#2b1c00;font-weight:700}
.pills button.done{background:rgba(31,157,99,.35);color:#fff}
main{max-width:1180px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.head{display:flex;gap:12px;align-items:flex-start;margin-bottom:8px}
.head .n{flex:none;background:var(--accent);color:#fff;border-radius:11px;padding:5px 10px;font-weight:700;font-size:13px}
.head h2{margin:0;font-size:20px;line-height:1.25}.head p{margin:3px 0 0;color:var(--muted)}
h3{font-size:15px;margin:18px 0 8px;color:var(--accent)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.ctrl{margin:9px 0}.ctrl label{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:14px;margin-bottom:3px}
.ctrl label b{color:var(--accent2)}
input[type=range]{width:100%;accent-color:var(--accent2)}
input[type=number],input[type=text],select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;cursor:pointer;text-align:left}
.opt:hover{border-color:var(--accent2)}.opt.sel{border-color:var(--accent2);background:var(--soft);box-shadow:0 0 0 3px rgba(42,90,160,.12)}
.opt small{display:block;color:var(--muted);font-size:12px}
.opt.right{border-color:var(--ok);background:#eaf7f0}.opt.wrong{border-color:var(--bad);background:#fdeeee}
.calc{background:#fbf8f1;border:1px dashed #d8cfba;border-radius:12px;padding:11px 14px;margin:10px 0}
.calc .f{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;margin:2px 0;overflow-wrap:anywhere}
.calc .res{font-size:17px;font-weight:700;color:var(--accent);margin-top:5px}
.chip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:650;margin:2px 4px 2px 0}
.chip.ok{background:#e3f5ec;color:var(--ok)}.chip.bad{background:#fbe3e3;color:var(--bad)}.chip.warn{background:#fdf1dc;color:#a96a00}
.note{border-left:4px solid var(--sun);background:#fff8e8;padding:9px 12px;border-radius:0 10px 10px 0;margin:10px 0;font-size:14px}
.note.blue{border-color:var(--accent2);background:var(--soft)}.note.red{border-color:var(--bad);background:#fdeeee}.note.green{border-color:var(--ok);background:#eaf7f0}
.fig{background:linear-gradient(#eaf2fb,#f7f3ea);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:8px 0}
.fig svg{display:block;width:100%;height:auto}
.fig .cap{font-size:12px;color:var(--muted);padding:4px 10px 6px;background:#fff}
table.t{border-collapse:collapse;width:100%;font-size:12.5px}
table.t th,table.t td{border:1px solid var(--line);padding:4px 6px;text-align:center}
table.t th{background:#f1ece0}table.t td.hl{background:#ffe7a8;font-weight:700}table.t td.pk{background:var(--accent2);color:#fff;font-weight:700}
.scroll{overflow:auto;max-width:100%}
.nav{display:flex;justify-content:space-between;gap:10px;margin:4px 0 30px}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:650;cursor:pointer;background:var(--accent2);color:#fff}
.btn.ghost{background:#fff;color:var(--accent);border:1.5px solid var(--line)}.btn.sun{background:var(--sun);color:#3a2600}
.btn:disabled{opacity:.4;cursor:default}
.home-cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hc{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:0;cursor:pointer;text-align:left;overflow:hidden}
.hc:hover{border-color:var(--accent2)}.hc .fig{margin:0;border:0;border-radius:0}.hc div.tx{padding:12px 16px}
.hc h3{margin:0 0 4px}.hc p{margin:0;color:var(--muted);font-size:14px}
.list .row{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 8px;margin-bottom:6px}
.list .row.off{opacity:.5}.list .row input[type=number]{width:70px;padding:4px 6px}
.list .row .nm{flex:1;font-size:14px}.list .row button{border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px;cursor:pointer}
.faults{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}.faults .opt{padding:6px 10px;font-size:13.5px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:14px}.kv b{color:var(--accent)}
.flow{stroke-dasharray:7 9;animation:flow 1s linear infinite}.flow.rev{animation-direction:reverse}.flow.slow{animation-duration:2.4s}
@keyframes flow{to{stroke-dashoffset:-32}}
.spin{animation:spin 1.1s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}
.ray{stroke-dasharray:50;animation:ray 1.8s ease-in infinite}@keyframes ray{0%{stroke-dashoffset:50;opacity:0}30%{opacity:1}100%{stroke-dashoffset:0;opacity:.2}}
.grow{transform-box:fill-box;transform-origin:left;animation:grow .7s ease-out both}@keyframes grow{from{transform:scaleX(0)}}
.clk{cursor:pointer}.clk:hover{filter:brightness(1.15)}
.busy{position:fixed;inset:0;background:rgba(20,30,50,.55);display:grid;place-items:center;z-index:50;color:#fff;font-weight:700;font-size:18px}
@media (max-width:860px){.g2,.home-cards{grid-template-columns:1fr}main{padding:10px}.card{padding:14px}.kv{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="hbar"><svg width="32" height="32" viewBox="0 0 40 40"><circle cx="20" cy="13" r="7" fill="#f5a524"/><path d="M6 36l6-14h16l6 14z" fill="#2a5aa0" stroke="#fff" stroke-width="1.2"/><path d="M13 22l-2.5 14M20 22v14M27 22l2.5 14M9 29h22" stroke="#fff"/></svg>
<h1 id="ttl">Simulatore impianti solari termici<small id="sub">Scegli la traccia</small></h1><button class="home" id="homeBtn">⌂ Tracce</button></div>
<div class="pills" id="pills"></div></header>
<main id="main"></main>
<script>
// ===================== UTILITÀ =====================
const $=s=>document.querySelector(s);
const fmt=(x,d=2)=>x==null||isNaN(x)?'-':Number(x).toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d});
const f0=x=>fmt(x,0),f1=x=>fmt(x,1),f2=x=>fmt(x,2),f3=x=>fmt(x,3);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
const xesc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const strip=s=>String(s).replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ');
function tcol(T){const t=clamp((T-10)/80,0,1),a=[47,127,216],b=[240,180,60],c=[224,60,40];
  const m=t<.5?a.map((v,i)=>lerp(v,b[i],t*2)):b.map((v,i)=>lerp(v,c[i],(t-.5)*2));return `rgb(${m.map(Math.round).join(',')})`}

// ===================== ZIP (store) =====================
const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRCT[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function makeZip(files,mime){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  for(const f of files){
    const name=enc.encode(f.name),data=typeof f.data==='string'?enc.encode(f.data):f.data,crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,0,true);lh.setUint16(12,0x21,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),name,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,0,true);ch.setUint16(14,0x21,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,name.length,true);ch.setUint32(38,0,true);ch.setUint32(42,off,true);
    cd.push(new Uint8Array(ch.buffer),name);off+=30+name.length+data.length;
  }
  const cds=cd.reduce((a,b)=>a+b.length,0),end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cds,true);end.setUint32(16,off,true);
  return new Blob([...parts,...cd,new Uint8Array(end.buffer)],{type:mime});
}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}

// ===================== SVG -> PNG =====================
function svgToPng(fig,scale=2){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{const c=document.createElement('canvas');c.width=fig.w*scale;c.height=fig.h*scale;const x=c.getContext('2d');
      x.fillStyle='#ffffff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>b.arrayBuffer().then(ab=>res({bytes:new Uint8Array(ab),w:fig.w,h:fig.h})),'image/png')};
    img.onerror=e=>rej(e);
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(fig.svg);
  });
}

// ===================== DOCX =====================
class Doc{
  constructor(title){this.name=title;this.b=[];this.nf=0;this.nt=0}
  h1(t){this.b.push({k:'h',s:'Heading1',t});return this}
  h2(t){this.b.push({k:'h',s:'Heading2',t});return this}
  h3(t){this.b.push({k:'h',s:'Heading3',t});return this}
  p(t,o={}){this.b.push({k:'p',t,o});return this}
  bul(items){items.forEach(t=>this.b.push({k:'p',t:'• '+t,o:{style:'Elenco'}}));return this}
  num(items){items.forEach((t,i)=>this.b.push({k:'p',t:(i+1)+'. '+t,o:{style:'Elenco'}}));return this}
  calc(lines){lines.forEach(t=>this.b.push({k:'p',t,o:{style:'Calcolo'}}));return this}
  table(rows,o={}){this.nt++;this.b.push({k:'tbl',rows,o});if(o.cap)this.b.push({k:'p',t:`Tabella ${this.nt}: ${o.cap}`,o:{style:'Didascalia'}});return this}
  fig(f,cap,o={}){this.nf++;this.b.push({k:'img',f,cap:`Figura ${this.nf}: ${cap}`,o});return this}
  pb(){this.b.push({k:'pb'});return this}
  cover(t,sub){this.b.push({k:'p',t,o:{style:'Titolo'}});if(sub)this.b.push({k:'p',t:sub,o:{style:'Sottotitolo'}});return this}
}
function runs(t,extra=''){
  return String(t).split(/(\*\*[^*]+\*\*)/).filter(Boolean).map(s=>{const b=s.startsWith('**');const x=b?s.slice(2,-2):s;
    return `<w:r><w:rPr>${b?'<w:b/>':''}${extra}</w:rPr><w:t xml:space="preserve">${xesc(x)}</w:t></w:r>`}).join('');
}
async function buildDocx(doc,onProg){
  const media=[];let body='',imgId=0;
  for(const bl of doc.b){
    if(bl.k==='h') body+=`<w:p><w:pPr><w:pStyle w:val="${bl.s}"/></w:pPr>${runs(bl.t)}</w:p>`;
    else if(bl.k==='p'){const o=bl.o||{};body+=`<w:p><w:pPr><w:pStyle w:val="${o.style||'Normal'}"/>${o.center?'<w:jc w:val="center"/>':''}</w:pPr>${runs(bl.t)}</w:p>`}
    else if(bl.k==='pb') body+='<w:p><w:r><w:br w:type="page"/></w:r></w:p>';
    else if(bl.k==='tbl'){
      const rows=bl.rows,nc=rows[0].length,tot=9638,w=bl.o.widths||Array(nc).fill(1),ws=w.reduce((a,b)=>a+b,0),cw=w.map(x=>Math.round(x/ws*tot));
      const B='<w:top w:val="single" w:sz="4" w:color="B8B2A2"/><w:left w:val="single" w:sz="4" w:color="B8B2A2"/><w:bottom w:val="single" w:sz="4" w:color="B8B2A2"/><w:right w:val="single" w:sz="4" w:color="B8B2A2"/><w:insideH w:val="single" w:sz="4" w:color="B8B2A2"/><w:insideV w:val="single" w:sz="4" w:color="B8B2A2"/>';
      body+=`<w:tbl><w:tblPr><w:tblW w:w="${tot}" w:type="dxa"/><w:tblBorders>${B}</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:top w:w="50" w:type="dxa"/><w:left w:w="90" w:type="dxa"/><w:bottom w:w="50" w:type="dxa"/><w:right w:w="90" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${cw.map(x=>`<w:gridCol w:w="${x}"/>`).join('')}</w:tblGrid>`;
      rows.forEach((r,ri)=>{const hd=ri===0&&bl.o.header!==false;const tot2=bl.o.total&&ri===rows.length-1;
        body+=`<w:tr>${hd?'<w:trPr><w:tblHeader/><w:cantSplit/></w:trPr>':'<w:trPr><w:cantSplit/></w:trPr>'}${r.map((c,ci)=>{const al=(bl.o.align||[])[ci]||(ci===0||String(c).length>28?'left':'center');
          const shd=hd?'<w:shd w:val="clear" w:color="auto" w:fill="2A5AA0"/>':tot2?'<w:shd w:val="clear" w:color="auto" w:fill="F1ECE0"/>':ri%2===0?'<w:shd w:val="clear" w:color="auto" w:fill="F4F7FC"/>':'';
          return `<w:tc><w:tcPr><w:tcW w:w="${cw[ci]}" w:type="dxa"/>${shd}<w:vAlign w:val="center"/></w:tcPr><w:p><w:pPr><w:pStyle w:val="Cella"/><w:jc w:val="${al}"/></w:pPr>${runs(c,hd?'<w:b/><w:color w:val="FFFFFF"/>':tot2?'<w:b/>':'')}</w:p></w:tc>`}).join('')}</w:tr>`});
      body+='</w:tbl><w:p><w:pPr><w:pStyle w:val="Cella"/></w:pPr></w:p>';
    }
    else if(bl.k==='img'){
      imgId++;onProg&&onProg(`Preparo le figure… ${imgId}`);
      const png=await svgToPng(bl.f);media.push(png.bytes);
      const maxW=(bl.o.width||16)*360000,cx=Math.round(maxW),cy=Math.round(maxW*png.h/png.w);
      let ccx=cx,ccy=cy;const maxH=19*360000;if(ccy>maxH){ccx=Math.round(cx*maxH/ccy);ccy=maxH}
      body+=`<w:p><w:pPr><w:pStyle w:val="Figura"/><w:jc w:val="center"/></w:pPr><w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${ccx}" cy="${ccy}"/><wp:docPr id="${imgId}" name="Figura ${imgId}"/><wp:cNvGraphicFramePr><a:graphicFrameLocks noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic><pic:nvPicPr><pic:cNvPr id="${imgId}" name="image${imgId}.png"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="rImg${imgId}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${ccx}" cy="${ccy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`;
      body+=`<w:p><w:pPr><w:pStyle w:val="Didascalia"/></w:pPr>${runs(bl.cap)}</w:p>`;
    }
  }
  const NS='xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"';
  const document_=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document ${NS}><w:body>${body}<w:sectPr><w:footerReference w:type="default" r:id="rFoot"/><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="567" w:footer="567" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const footer=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:ftr ${NS}><w:p><w:pPr><w:pStyle w:val="PiePagina"/><w:tabs><w:tab w:val="right" w:pos="9638"/></w:tabs></w:pPr>${runs(doc.name)}<w:r><w:tab/><w:t xml:space="preserve">Pagina </w:t></w:r><w:r><w:fldChar w:fldCharType="begin"/></w:r><w:r><w:instrText xml:space="preserve"> PAGE </w:instrText></w:r><w:r><w:fldChar w:fldCharType="separate"/></w:r><w:r><w:t>1</w:t></w:r><w:r><w:fldChar w:fldCharType="end"/></w:r></w:p></w:ftr>`;
  const st=(id,name,ppr,rpr,extra='')=>`<w:style w:type="paragraph" w:styleId="${id}"><w:name w:val="${name}"/><w:basedOn w:val="Normal"/>${extra}<w:qFormat/><w:pPr>${ppr}</w:pPr><w:rPr>${rpr}</w:rPr></w:style>`;
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:eastAsia="Calibri" w:cs="Calibri"/><w:sz w:val="22"/><w:szCs w:val="22"/><w:lang w:val="it-IT"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="120" w:line="276" w:lineRule="auto"/><w:jc w:val="both"/></w:pPr></w:pPrDefault></w:docDefaults>
<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>
${st('Titolo','Title','<w:jc w:val="center"/><w:spacing w:before="1800" w:after="240"/>','<w:b/><w:color w:val="16325C"/><w:sz w:val="48"/>')}
${st('Sottotitolo','Subtitle','<w:jc w:val="center"/><w:spacing w:after="480"/>','<w:color w:val="5F6878"/><w:sz w:val="28"/>')}

function rFromG(p,G){
  const g=p.g; if(G<=g[0]) return PIPE_R[0]*(G/g[0])**1.8; // estrapolazione ~G^1.8
  for(let i=1;i<g.length;i++){ if(g[i]==null) return null; if(G<=g[i]){const t=(G-g[i-1])/(g[i]-g[i-1]);return lerp(PIPE_R[i-1],PIPE_R[i],t)} }
  return null;
}
function vel(G,di){return G/3.6e6/(Math.PI*(di/1000)**2/4)}

function insThick(lam,de){
  const c=insCol(de); lam=clamp(lam,0.030,0.050);
  let i=INS_L.findIndex(v=>v>=lam-1e-9); if(i<0) i=INS_L.length-1; if(Math.abs(INS_L[i]-lam)<1e-6||i===0) return {s:INS_T[i][c],i0:i,i1:i,c};
  const t=(lam-INS_L[i-1])/(INS_L[i]-INS_L[i-1]);
  if(t<1e-6) return {s:INS_T[i-1][c],i0:i-1,i1:i-1,c};
  return {s:lerp(INS_T[i-1][c],INS_T[i][c],t),i0:i-1,i1:i,c,t};
}

function SV(w,h,body,bg='#ffffff'){return {w,h,svg:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" font-family="Arial, Helvetica, sans-serif">${bg?`<rect width="${w}" height="${h}" fill="${bg}"/>`:''}${body}</svg>`}}
const T=(x,y,t,o={})=>`<text x="${x}" y="${y}" font-size="${o.s||11}" fill="${o.c||'#33405a'}" font-weight="${o.w||'bold'}" text-anchor="${o.a||'start'}"${o.tr?` transform="${o.tr}"`:''}>${xesc(t)}</text>`;
const LN=(d,col,on,L,w=5,cls='')=>`<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" opacity="${on?1:0.28}"${L&&on?` class="flow ${cls}"`:''}/>`;
function sunG(x,y,r=14,L=false){let s='';for(let i=0;i<8;i++){const a=i*Math.PI/4;s+=`<line x1="${x+Math.cos(a)*(r+4)}" y1="${y+Math.sin(a)*(r+4)}" x2="${x+Math.cos(a)*(r+10)}" y2="${y+Math.sin(a)*(r+10)}"/>`}
  return `<g${L?' class="pulse"':''} stroke="#f5a524" stroke-width="2.5" stroke-linecap="round">${s}</g><circle cx="${x}" cy="${y}" r="${r}" fill="#ffcf5c" stroke="#f5a524" stroke-width="2"/>`}
function panelRect(x,y,w,h,col='#1d3d73',vert=true){let s=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="${col}" stroke="#a9c4ef" stroke-width="1.2"/>`;
  for(let k=1;k<6;k++) s+=vert?`<line x1="${x+w*k/6}" y1="${y+3}" x2="${x+w*k/6}" y2="${y+h-3}" stroke="#4d6fa6" stroke-width=".8"/>`:`<line x1="${x+3}" y1="${y+h*k/6}" x2="${x+w-3}" y2="${y+h*k/6}" stroke="#4d6fa6" stroke-width=".8"/>`;return s}

function figHouse({tilt=35,lat=37.3,flat=false,L=false,N=4}){
  const W=560,H=300,gy=262,x0=180,x1=420,y0=168,mid=(x0+x1)/2;let b='';
  b+=`<rect width="${W}" height="${gy}" fill="#e6f0fb"/><rect y="${gy}" width="${W}" height="${H-gy}" fill="#c9d8a8"/>`;
  b+=T(10,gy+22,'SUD')+T(W-48,gy+22,'NORD');
  b+=`<rect x="${x0}" y="${y0}" width="${x1-x0}" height="${gy-y0}" fill="#efe4cf" stroke="#9b8c70" stroke-width="2"/>`;
  for(let p=0;p<2;p++)for(let i=0;i<3;i++)b+=`<rect x="${x0+24+i*85}" y="${gy-40-p*46}" width="22" height="26" fill="#cfe3f5" stroke="#55606f"/>`;
  let P;
  if(flat){b+=`<rect x="${x0-6}" y="${y0-8}" width="${x1-x0+12}" height="8" fill="#8b5e3c"/>`;const Lp=60,a=rad(tilt);
    for(let i=0;i<2;i++){const bx=x0+30+i*110;b+=`<line x1="${bx}" y1="${y0-8}" x2="${bx+Lp*Math.cos(a)}" y2="${y0-8-Lp*Math.sin(a)}" stroke="#1d3d73" stroke-width="8" stroke-linecap="round"/><line x1="${bx+Lp*Math.cos(a)}" y1="${y0-8-Lp*Math.sin(a)}" x2="${bx+Lp*Math.cos(a)}" y2="${y0-8}" stroke="#777" stroke-width="2"/>`}
    P=[x0+30+Lp*Math.cos(a)/2,y0-8-Lp*Math.sin(a)/2];
  } else {
    const t=Math.tan(rad(tilt)),xs=x0-22,rise=t*(mid-xs);
    b+=`<polygon points="${xs},${y0} ${mid},${y0-rise} ${x1+22},${y0}" fill="#b5523b" stroke="#7d3424" stroke-width="2"/>`;
    const ya=x=>y0-t*(x-xs)-6, xa=x0, xb=mid-22;
    b+=`<line x1="${xa}" y1="${ya(xa)}" x2="${xb}" y2="${ya(xb)}" stroke="#1d3d73" stroke-width="9" stroke-linecap="round"/>`;
    b+=`<path d="M ${xs+38} ${y0} A 38 38 0 0 0 ${xs+38*Math.cos(rad(tilt))} ${y0-38*Math.sin(rad(tilt))}" fill="none" stroke="#fff" stroke-width="1.5"/>`+T(xs+42,y0-6,tilt+'°',{c:'#fff'});
    P=[(xa+xb)/2,ya((xa+xb)/2)];
  }
  const suns=[[90-lat-23.45,'21 dicembre','#2f7fd8'],[90-lat+23.45,'21 giugno','#e0482f']];
  suns.forEach(([a,lb,c],i)=>{const R=i?150:230,sx=Math.max(26,P[0]-R*Math.cos(rad(a))),sy=Math.max(24,P[1]-R*Math.sin(rad(a)));
    b+=`<line x1="${sx}" y1="${sy}" x2="${P[0]}" y2="${P[1]}" stroke="${c}" stroke-width="2.5" stroke-dasharray="6 5"${L?' class="flow slow"':''}/>`+sunG(sx,sy,12,L)+T(sx+18,sy+(i?-14:20),`${lb}: ${f1(a)}°`,{c})});
  b+=T(W-10,20,`Latitudine ${f1(lat)}° N`,{a:'end'});
  return SV(W,H,b);

 ctrl:D=>`<div class="note blue"><b>Traccia.</b> Villetta unifamiliare di 180 m² in provincia di Agrigento: impianto a pannelli solari per servizio combinato idrosanitario e riscaldamento a pannelli radianti. Dimensionare l’impianto e la disposizione sul tetto esposto a Sud, a falda inclinata di 35°.</div>
  <div class="g2"><div><div class="ctrl"><label>Località</label><select data-k="loc" data-full="1">${Object.entries(LOC).map(([k,l])=>`<option value="${k}" ${S.loc===k?'selected':''}>${l.n} (Italia ${l.zona})</option>`).join('')}</select></div>
  ${num('A','Superficie abitata (m²)',30,1000,5)}${num('pers','Occupanti',1,20,1)}</div>
  <div>${opt('roof',[['falda','Tetto a falda'],['piano','Tetto piano']])}${S.roof==='falda'?rng('tilt','Inclinazione falda',10,60,1,'°'):rng('flatTilt','Inclinazione cavalletti',20,65,5,'°')}${rng('az','Orientamento (0 = Sud)',-90,90,5,'°')}</div></div>`,
 out:D=>`<div class="g2"><div>${figBox(figHouse({tilt:D.tilt,lat:D.L.lat,flat:S.roof==='piano',L:true}),'Sezione Sud-Nord: altezza del sole a mezzogiorno in inverno e in estate')}</div><div>
  ${calc([`Zona per la tabella Caleffi: Italia ${D.L.zona}`,`T esterna di progetto: ${D.L.tp} °C`,`Sole a mezzogiorno 21/12: 90 − ${f1(D.L.lat)} − 23,45 = ${f1(D.noonW)}°`,`Inclinazione ideale per un combinato: lat + 10 = ${f0(D.ideal)}°`])}
  ${D.tilt>=35?chip('ok','inclinazione ≥ 35°: adatta al carico invernale'):D.tilt>=15?chip('warn','inclinazione da impianto estivo'):chip('bad','sotto i 15° minimi')} ${Math.abs(S.az)<=30?chip('ok','orientamento entro ±30° da Sud'):chip('warn','orientamento sfavorevole')}
  ${figBox(figCompass(S.az,D.oLoss),'')}</div></div>`},
{t:'Superficie captante e numero di pannelli',sub:'Tabella Caleffi pag. 19, impianti combinati di piccole dimensioni; pannello Riello RPS 25/4.',
 ctrl:D=>`<div class="scroll"><table class="t"><tr><th>Zona</th><th>m² di pannello ogni 10 m² abitati</th></tr>${Object.entries(ZONE).map(([z,v])=>`<tr><th>Italia ${z}</th><td class="${z===D.L.zona?'hl':''}">${f2(v.small[1])} ÷ ${f2(v.small[0])}</td></tr>`).join('')}</table></div>
  ${rngX('coef','Coefficiente scelto',D.zr[0],D.zr[1],0.01,'m²/10 m²',2)}
  ${opt('aref',[['lorda','Area pannello 2,3 m²','come nella traccia'],['ap','Area di apertura 2,152 m²','più rigorosa']])}`,
 out:D=>`${calc([`S = coefficiente × superficie / 10 = ${f2(D.coef)} × ${f0(S.A)} / 10`],`S = ${f2(D.Sreq)} m²`)}
  ${calc([`N = S / A pannello = ${f2(D.Sreq)} / ${f3(D.Ap)} = ${f2(D.Nraw)} → arrotondo per eccesso`],`N = ${D.N} pannelli · superficie installata ${f2(D.S)} m²`)}
  ${figBox(figTiles(D.Sreq,D.N,D.Ap),'Dalla superficie necessaria al numero di collettori')}
  <div class="g2"><div>${figBox(figPanelType('piano',true),'Collettore piano vetrato RPS 25/4: strati e funzionamento')}</div>
  <div class="kv"><b>Dimensioni</b><span>2004 × 1195 × 85 mm, 44 kg</span><b>Superfici</b><span>lorda 2,301 · apertura 2,152 m²</span><b>Contenuto</b><span>1,6 l</span><b>Rendimento</b><span>η0 0,802 · a1 4,28 · a2 0,0064</span><b>Stagnazione</b><span>197 °C</span><b>In linea</b><span>max 10 verticali, 6 orizzontali</span></div></div>`},
{t:'Disposizione sul tetto',sub:'Ingombri, distanze dai bordi, ostacoli, staffaggio e collegamento.',
 ctrl:D=>`<div class="g2"><div>${opt('orient',[['V','Verticali','1195 mm, max 10 in linea'],['O','Orizzontali','2004 mm, max 6 in linea']])}</div><div>${rng('rows','Numero di file',1,Math.min(3,D.N),1,'')}${rng('margin','Fascia libera dai bordi',0.3,1.5,0.1,'m',1)}</div></div>`,
 out:D=>{const Ly=D.layout,V=S.orient==='V';return `${figBox(figRoof(D),'Pianta della falda con i collettori, la fascia di rispetto e il camino')}
  ${Ly.bad?chip('bad',`${Ly.bad} pannelli non stanno`):chip('ok','tutti i pannelli rientrano nella zona utile')} ${chip('ok',`campo ${f2(Ly.blockW)} × ${f2(Ly.blockH)} m`)}
  ${calc([`Kit staffaggio Riello per ${Ly.per} collettori ${V?'verticali':'orizzontali'}: ${(V?KIT_V:KIT_O)[Math.min(6,Ly.per)]}`,`Lunghezza binari L = ${V?120:210} × ${Ly.per} = ${(V?120:210)*Ly.per} cm`])}
  ${figBox(figConn(D),'Collegamento idraulico dei collettori')}`}},
{t:'Portata e tubazioni',sub:'Metodo delle perdite di carico lineari costanti (Caleffi pag. 24, Tab. 7A).',
 ctrl:D=>`<h3>Che tubo usi?</h3><div class="opts">${PIPE_Q.map(([k,t,s])=>`<button class="opt ${S.pipeMat===k?PIPE_FB[k][0]:''}" data-set="pipeMat" data-val="${k}">${t}${s?`<small>${s}</small>`:''}</button>`).join('')}</div>
  ${S.pipeMat?`<div class="note ${PIPE_FB[S.pipeMat][0]==='right'?'green':'red'}">${PIPE_FB[S.pipeMat][1]}</div>`:''}
  <div class="g2"><div>${rng('rmax','Perdita lineare massima r',10,20,1,'mm c.a./m')}</div><div>${rng('Lone','Lunghezza tetto → centrale termica',3,40,1,'m')}</div></div>`,
 out:D=>`${calc([`Portata specifica = q / Δt = 400 / 10 = 40 l/(h·m²)`,`G = 40 × ${f2(D.S)} m²`],`G = ${f0(D.G)} l/h · potenza ${f2(D.QkW)} kW`)}
  ${pipeTable(D)}
  ${calc([`Colonna De ${f1(D.pipe.p.de)}: con ${f0(D.G)} l/h interpolo r ≈ ${f2(D.pipe.r)} mm c.a./m`,`Perdite distribuite = ${f2(D.pipe.r)} × ${D.Ltot} m = ${f0(D.Hdist)} mm c.a.`],`Tubo acciaio De ${f1(D.pipe.p.de)} mm (Di ${f1(D.pipe.p.di)})`)}
  ${figBox(figPipe(D,true),'Sezione del tubo isolato e moto del fluido')}`},
{t:'Isolamento delle tubazioni',sub:'DPR 412/93 all. B e Tab. 9 (superficie esterna del tubo isolato).',
 ctrl:D=>`${opt('insMat',Object.entries(INS_MAT).map(([k,m])=>[k,m.n,`λ ${f3(m.l)} · max ${m.tmax} °C`]))}
  <div class="ctrl"><label>Posizione del tratto</label><select data-k="insPos" data-full="1">${Object.entries(INS_POS).map(([k,p])=>`<option value="${k}" ${S.insPos===k?'selected':''}>${p.n}</option>`).join('')}</select></div>`,
 out:D=>`${insTable(D)}${calc([`De ${f1(D.pipe.p.de)} mm → colonna “${INS_C[D.ins.c]}”, λ = ${f3(S.lam)}`,`Spessore da tabella ${f1(D.ins.s)} mm × ${D.insK} (posizione) = ${f1(D.insReq)} mm`,`S est = π × (${f1(D.pipe.p.de)} + 2 × ${D.insComm}) / 1000 = ${f3(D.Sext)} m²/m`],`Isolante ${D.insComm} mm · ${f3(D.Sext)} m² per metro`)}
  ${D.im.tmax<150?`<div class="note red">${D.im.n} regge circa ${D.im.tmax} °C: vicino ai collettori (stagnazione fino a 197 °C) serve EPDM alta temperatura.</div>`:''}
  <div class="note">All’esterno l’isolante va protetto da acqua, raggi UV e animali con lamiera zincata o alluminio.</div>`},
{t:'Antigelo e accumulo',sub:'Glicole fino a 10 °C sotto la T di progetto; V = (50 ÷ 60) × S; scambiatore 35 ÷ 40% di S.',
 ctrl:D=>`<div class="g2"><div>${rng('kV','Litri per m² di pannello',50,60,1,'l/m²')}</div><div>${rng('scPct','Scambiatore interno',35,40,1,'% di S')}</div></div>`,
 out:D=>`<div class="g2"><div>${calc([`Protezione = ${D.L.tp} − 10 = ${D.Tprot} °C`],`Glicole propilenico ${D.gly.p}% (fino a ${D.gly.t} °C)`)}${figBox(figThermo(D),'Scelta della concentrazione di glicole')}</div>
  <div>${calc([`V = ${S.kV} × ${f2(D.S)} = ${f0(D.Vcalc)} l`,`Scambiatore = ${S.scPct}% × ${f2(D.S)} = ${f2(D.Ssc)} m²`],`Serbatoio tank in tank da ${D.Vtank} l`)}${figBox(figTank('tit',{},true),'Serbatoio combinato tank in tank')}</div></div>`},
{t:'Vaso d’espansione e circolatore',sub:'VU = (VC · e + VP) · k; VN = VU · (PF + 1) / (PF − PI). Prevalenza per vincere tutte le resistenze.',
 ctrl:D=>`<div class="g2"><div>${num('Pvs','Taratura valvola di sicurezza (bar)',3,10,0.5)}</div><div>${num('Hsc','Perdita scambiatore + gruppo (mm c.a.)',0,3000,50)}</div></div>`,
 out:D=>`<div class="g2"><div>${calc([`VP = ${D.N} × 1,6 = ${f1(D.VP)} l · VC = ${f1(D.VC)} l`,`VU = (${f1(D.VC)} × 0,07 + ${f1(D.VP)}) × 1,1 = ${f1(D.VU)} l`,`PI = ${f1(D.Hst)}/10,2 + 0,5 = ${f1(D.PI)} bar · PF = ${f1(D.PF)} bar`,`VN = ${f1(D.VU)} × ${f1(D.PF+1)} / ${f1(D.PF-D.PI)} = ${f1(D.VN)} l`],`Vaso da ${D.vaso} l`)}${figBox(figVaso(D,130,true),'Il vaso accoglie dilatazione e vapore in stagnazione')}</div>
  <div>${calc([`Tubi: (${f0(D.Hdist)} + ${f0(D.Hloc)}) × 1,25 (glicole) = ${f0(D.Hpipe)} mm`,`Collettori ${f0(D.Hcoll)} + scambiatore e gruppo ${f0(S.Hsc+S.Hgr)} mm`],`${f2(D.G/1000)} m³/h a ${f2(D.Hsys/1000)} m c.a.`)}${figBox(figPump(D),'Scelta del circolatore')}</div></div>`},
{t:'Schema completo e funzionamento',sub:'Tocca i numeri per vedere ogni componente; cambia la situazione per vedere cosa si accende.',
 ctrl:D=>`${opt('scen1',[['sole','Sole forte'],['debole','Sole debole'],['notte','Notte']])}`,
 out:D=>{const st=SCEN[S.scen1];return `${figBox(figSchema({L:true,st,hi:S.comp,N:D.N}),'Schema dell’impianto combinato')}${compCard()}`}},
{t:'Relazione Word',sub:'Compila l’intestazione e scarica la relazione completa con tutte le figure.',report:true}
]};
const SCEN={sole:{sun:1,pump:1,boil:0,heat:1,acs:1,Tc:62,Tt:58,Tb:40},debole:{sun:1,pump:1,boil:1,heat:1,acs:1,Tc:42,Tt:47,Tb:33},notte:{sun:0,night:1,pump:0,boil:1,heat:1,acs:0,Tc:8,Tt:48,Tb:36}};

async function report1(prog){
  const D=compute1(),Ly=D.layout,doc=new Doc('Relazione tecnica: impianto solare termico combinato');
  doc.cover('Relazione tecnica','Dimensionamento di un impianto solare termico combinato per acqua calda sanitaria e riscaldamento a pannelli radianti');
  doc.table([['Dato','Valore'],['Studente',S.studente||'-'],['Classe',S.classe||'-'],['Istituto',S.scuola||'-'],['Data',S.data||'-'],['Località',`${D.L.n} (Italia ${D.L.zona})`],['Edificio',`villetta unifamiliare, ${f0(S.A)} m²`]],{widths:[1,2]});
  doc.fig(figHouse({tilt:D.tilt,lat:D.L.lat,flat:S.roof==='piano'}),'Sezione dell’edificio con i collettori e le altezze del sole a mezzogiorno',{width:14}).pb();
  doc.h1('1. Dati di progetto').p(`L’edificio è una villetta unifamiliare di ${f0(S.A)} m² a ${D.L.n}, latitudine ${f1(D.L.lat)}° N, temperatura esterna di progetto ${D.L.tp} °C. L’impianto solare deve servire sia la produzione di acqua calda sanitaria sia il riscaldamento con pannelli radianti a bassa temperatura (30-35 °C), condizione che permette ai collettori di lavorare con buon rendimento anche d’inverno.`);
  doc.p(S.roof==='falda'?`I collettori si montano complanari alla falda esposta a Sud (orientamento ${S.az}°), inclinata di ${S.tilt}°. L’inclinazione ideale per un impianto combinato sarebbe latitudine + 10° = ${f0(D.ideal)}°; mantenendo quella del tetto la perdita è modesta e si riducono carichi di vento e costi. La perdita dovuta all’orientamento è circa ${f1(D.oLoss)}%.`:`I collettori si montano su cavalletti inclinati di ${S.flatTilt}° sul tetto piano.`);
  doc.calc([`Altezza del sole il 21 dicembre: 90 − ${f1(D.L.lat)} − 23,45 = ${f1(D.noonW)}°`,`Altezza del sole il 21 giugno: 90 − ${f1(D.L.lat)} + 23,45 = ${f1(D.noonS)}°`]);
  doc.h1('2. Superficie captante e numero di collettori');
  doc.p(`Per impianti combinati in edifici abitativi ben isolati con riscaldamento a bassa temperatura, la tabella Caleffi (Idraulica 29, pag. 19) indica per l’Italia ${D.L.zona} da ${f2(D.zr[1])} a ${f2(D.zr[0])} m² di pannello ogni 10 m² di superficie abitata. Si assume ${f2(D.coef)}.`);
  doc.calc([`S = ${f2(D.coef)} × ${f0(S.A)} / 10 = ${f2(D.Sreq)} m²`,`N = S / A pannello = ${f2(D.Sreq)} / ${f3(D.Ap)} = ${f2(D.Nraw)} → ${D.N} collettori`,`Superficie installata = ${D.N} × ${f3(D.Ap)} = ${f2(D.S)} m²`]);
  doc.fig(figTiles(D.Sreq,D.N,D.Ap),'Dalla superficie necessaria al numero di collettori');
  doc.h2('Il collettore Riello RPS 25/4').p('Collettore piano vetrato con assorbitore in alluminio a finitura selettiva (assorbimento 95%, emissività 4%), vetro solare da 3,2 mm, isolamento in lana minerale da 40 mm e telaio in alluminio. Si installa sia in verticale sia in orizzontale.');
  doc.table([['Caratteristica','Valore'],['Superficie lorda / apertura','2,301 / 2,152 m²'],['Dimensioni e peso','2004 × 1195 × 85 mm, 44 kg'],['Contenuto di liquido','1,6 l'],['Rendimento η0, a1, a2','0,802 · 4,28 · 0,0064'],['Temperatura di stagnazione','197 °C'],['Pressione massima','10 bar'],['Collettori in linea','10 verticali / 6 orizzontali']],{widths:[2,2],cap:'Dati tecnici del collettore'});
  doc.fig(figPanelType('piano'),'Struttura del collettore piano vetrato',{width:13});
  doc.h1('3. Disposizione sul tetto');
  doc.p(`I ${D.N} collettori sono montati ${S.orient==='V'?'in verticale':'in orizzontale'} su ${Ly.rows} fila/e da ${Ly.per}. Il campo occupa ${f2(Ly.blockW)} × ${f2(Ly.blockH)} m e lascia una fascia libera di ${f1(S.margin)} m dai bordi della falda, lontano dal camino. ${Ly.bad?'Attenzione: alcuni pannelli non rientrano nella zona utile e la disposizione va corretta.':'Tutti i collettori rientrano nella zona utile.'}`);
  doc.p(`Staffaggio Riello su tetto a falda con vite prigioniera, kit per ${Ly.per} collettori: ${(S.orient==='V'?KIT_V:KIT_O)[Math.min(6,Ly.per)]} (A-B-C barre di supporto, D-E fissaggi al tetto, F giunti, H bloccaggi, I raccordi).`);
  doc.fig(figRoof(D),'Pianta della falda con la posizione dei collettori');
  doc.p(S.orient==='V'?'In verticale i collettori, con assorbitore ad arpa, sono attraversati in parallelo. La mandata parte dal lato della sonda dell’ultimo collettore, nella parte alta.':'In orizzontale i collettori sono attraversati in serie, al massimo 6 per linea.');
  doc.fig(figConn(D),'Collegamento idraulico dei collettori',{width:13});
  doc.h1('4. Portata e tubazioni');
  doc.p('La portata del circuito solare si ricava dalla potenza specifica di progetto q = 400 kcal/(h·m²) e dal salto termico Δt = 10 °C.');
  doc.calc([`Portata specifica = 400 / 10 = 40 l/(h·m²)`,`G = ${S.gs} × ${f2(D.S)} = ${f0(D.G)} l/h`,`Q = 400 × ${f2(D.S)} = ${f0(D.Q)} kcal/h = ${f2(D.QkW)} kW`]);
  doc.p(`Le tubazioni sono in **acciaio non zincato**: il tubo zincato, indicato nella traccia, non si può usare perché oltre 60 °C, specie con il glicole, subisce la dezincatura. Esclusi anche plastica e multistrato (temperature oltre 180 °C). Il dimensionamento segue il metodo delle perdite di carico lineari costanti con r tra 10 e ${S.rmax} mm c.a./m (Tab. 7A, tubi in acciaio, acqua a 50 °C).`);
  doc.calc([`Tubo De ${f1(D.pipe.p.de)} mm (Di ${f1(D.pipe.p.di)} mm) con G = ${f0(D.G)} l/h`,`r ≈ ${f2(D.pipe.r)} mm c.a./m · v = ${f2(D.pipe.v)} m/s`,`Perdite distribuite = ${f2(D.pipe.r)} × ${D.Ltot} m = ${f0(D.Hdist)} mm c.a.`]);
  doc.fig(figPipe(D),'Sezione del tubo isolato e condizioni di moto',{width:13});
  doc.h1('5. Isolamento termico');
  doc.p(`Isolante: ${D.im.n} con conduttività λ = ${f3(S.lam)} W/(m·K). Lo spessore minimo si ricava dalla tabella dell’allegato B al DPR 412/93 in funzione del diametro esterno del tubo e di λ.`);
  doc.calc([`De ${f1(D.pipe.p.de)} mm → colonna ${INS_C[D.ins.c]} mm`,`Spessore = ${f1(D.ins.s)} mm × ${D.insK} (${INS_POS[S.insPos].n.toLowerCase()}) = ${f1(D.insReq)} mm → ${D.insComm} mm commerciale`,`Superficie esterna (Tab. 9) = π × (${f1(D.pipe.p.de)} + 2 × ${D.insComm}) / 1000 = ${f3(D.Sext)} m²/m`,`Per ${D.Ltot} m di tubo: ${f2(D.Sext*D.Ltot)} m² di rivestimento`]);
  doc.p('Nei tratti esterni l’isolante è protetto da acqua, raggi UV, roditori e uccelli con un mantello in lamiera zincata o alluminio. Vicino ai collettori serve un materiale resistente alle alte temperature (EPDM o lana minerale).');
  doc.h1('6. Fluido antigelo');
  doc.calc([`Protezione richiesta = ${D.L.tp} − 10 = ${D.Tprot} °C`,`Glicole propilenico ${D.gly.p}% → protezione fino a ${D.gly.t} °C`]);
  doc.fig(figThermo(D),'Scelta della concentrazione del glicole',{width:12});
  doc.h1('7. Serbatoio di accumulo e scambiatore');
  doc.calc([`V = ${S.kV} × ${f2(D.S)} = ${f0(D.Vcalc)} l → serbatoio commerciale da ${D.Vtank} l`,`Scambiatore interno = ${S.scPct}% × ${f2(D.S)} = ${f2(D.Ssc)} m²`]);
  doc.p(`Per l’impianto combinato si sceglie un serbatoio tank in tank: il serbatoio esterno contiene l’acqua tecnica per i pannelli radianti, quello interno l’acqua calda sanitaria (circa ${f0(D.ACS)} l/giorno a 45 °C per ${S.pers} persone). Il serpentino solare riscalda la parte bassa, la caldaia integra nella parte alta.`);
  doc.fig(figTank('tit'),'Serbatoio combinato tank in tank',{width:11});
  doc.h1('8. Vaso d’espansione');
  doc.calc([`VP = ${D.N} × 1,6 = ${f1(D.VP)} l · VC = ${f1(D.VC)} l (pannelli, tubi, scambiatore, gruppo)`,`VU = (VC × 0,07 + VP) × 1,1 = ${f1(D.VU)} l`,`PI = ${f1(D.Hst)} / 10,2 + 0,5 = ${f1(D.PI)} bar · PF = ${f1(S.Pvs)} − 0,5 = ${f1(D.PF)} bar`,`VN = ${f1(D.VU)} × (${f1(D.PF)} + 1) / (${f1(D.PF)} − ${f1(D.PI)}) = ${f1(D.VN)} l → vaso da ${D.vaso} l`]);
  doc.p('Il vaso contiene sia la dilatazione del fluido sia il vapore che si forma nei collettori in stagnazione. Va montato sul ritorno, con attacco verso il basso e senza isolamento.');
  doc.fig(figVaso(D,130),'Funzionamento del vaso d’espansione in stagnazione',{width:11});
  doc.h1('9. Circolatore');
  doc.calc([`Perdite tubazioni = (${f0(D.Hdist)} + ${f0(D.Hloc)}) × 1,25 = ${f0(D.Hpipe)} mm c.a.`,`Collettori = ${f0(D.Hcoll)} mm c.a. · scambiatore e gruppo = ${f0(S.Hsc+S.Hgr)} mm c.a.`,`Circolatore: ${f2(D.G/1000)} m³/h con prevalenza ${f2(D.Hsys/1000)} m c.a.`]);
  doc.fig(figPump(D),'Curva dell’impianto e punto di lavoro del circolatore',{width:13});
  doc.h1('10. Schema dell’impianto e componenti');
  doc.fig(figSchema({N:D.N}),'Schema completo dell’impianto combinato con i componenti numerati');
  doc.table([['N.','Componente','Funzione'],...COMPS.map((c,i)=>[String(i+1),c.n,c.d])],{widths:[.4,2,5],cap:'Legenda dei componenti dello schema'});
  doc.h1('11. Riepilogo');
  doc.table([['Voce','Risultato'],['Superficie captante',`${D.N} × RPS 25/4 = ${f2(D.S)} m²`],['Portata circuito solare',`${f0(D.G)} l/h`],['Tubazioni',`acciaio non zincato De ${f1(D.pipe.p.de)} mm`],['Isolamento',`${D.insComm} mm, ${f3(D.Sext)} m²/m`],['Antigelo',`glicole ${D.gly.p}%`],['Accumulo',`tank in tank ${D.Vtank} l`],['Scambiatore',`${f2(D.Ssc)} m²`],['Vaso d’espansione',`${D.vaso} l, precarica ${f1(D.PI)} bar`],['Valvola di sicurezza',`${f1(S.Pvs)} bar`],['Circolatore',`${f2(D.G/1000)} m³/h · ${f2(D.Hsys/1000)} m c.a.`]],{widths:[2,3]});
  return doc;
}
EX1.report=report1;
// ===================== TRACCIA 2: DIAGNOSTICA E MANUTENZIONE =====================
function ctrlUpdate(){const dT=S.Tc-S.Tb;if(!S.ctrlOn&&dT>7&&S.Tb<S.Tmax)S.ctrlOn=true;if(S.ctrlOn&&(dT<3||S.Tb>=S.Tmax))S.ctrlOn=false}
function actsOn(){return S.acts.filter(a=>a.inc)}
function ganttTableHTML(){const R=ganttRows(actsOn());const tot=R.length?R[R.length-1].e:0;

async function report2(){
  const doc=new Doc('Diagnostica impianti termici e solari - Relazione tecnica (traccia n. 2)');
  const comps=COMPS.filter(c=>S.compOn[c.k]),faults=FAULTS.filter(f=>S.faultOn[f.k]),acts=actsOn(),R=ganttRows(acts),tot=R.length?R[R.length-1].e:0;
  doc.cover('Relazione tecnica di diagnostica e manutenzione','Impianto solare termico combinato a servizio di una villetta a schiera: riscaldamento radiante a pavimento e acqua calda sanitaria');
  doc.table([['Dato','Valore'],['Studente',S.studente||'-'],['Classe',S.classe||'-'],['Istituto',S.scuola||'-'],['Data',S.data||'-'],['Traccia','Diagnostica impianti termici e solari n. 2']],{widths:[1,2]});
  doc.p(`**Sintesi.** Analisi dei componenti, della regolazione e dei guasti tipici di un impianto solare termico combinato con serbatoio ${TANK_TYPES[S.tankType].n.toLowerCase()} e caldaia integrativa, e programmazione del controllo periodico con diagramma di Gantt (durata totale ${tot} minuti).`).pb();
  doc.h1('1. Inquadramento tecnico e descrizione dell’impianto');
  doc.p('L’impianto serve una villetta a schiera e realizza un sistema solare termico combinato: garantisce il riscaldamento invernale degli ambienti con pannelli radianti a bassa temperatura annegati nel pavimento e la produzione di acqua calda sanitaria (ACS). Nei periodi di scarso irraggiamento il calore mancante è fornito da una caldaia integrativa, murale o a basamento.');
  doc.p('Il circuito primario (collettori, tubazioni, gruppo di circolazione, scambiatore) contiene una miscela di acqua e glicole propilenico e lavora a circolazione forzata, comandata da una centralina differenziale. I pannelli radianti, che lavorano a 30-35 °C, permettono ai collettori di funzionare con buon rendimento anche d’inverno.');
  doc.h1('2. Componenti fondamentali');
  doc.p('La corretta realizzazione dell’impianto richiede i seguenti componenti:');
  doc.bul(comps.map(c=>`**${c.n}:** ${c.d}`));
  doc.fig(figSchema({}),'Schema generale dell’impianto solare termico combinato con i componenti numerati');
  doc.table([['N.','Componente'],...COMPS.map((c,i)=>[String(i+1),c.n])],{widths:[.5,5],cap:'Legenda dello schema'});
  doc.h1('3. Tipologie di pannelli solari e serbatoi di accumulo');
  doc.p('I collettori solari termici si dividono in collettori ad alta temperatura, con specchi concentratori, e a bassa temperatura. Questi ultimi comprendono:');
  doc.bul(Object.values(PANEL_TYPES).map(p=>`**${p.n}:** ${p.d}`));
  doc.p(`Nell’impianto in esame sono installati collettori **${PANEL_TYPES[S.panelType].n.toLowerCase()}**.`);
  doc.fig(figPanelType(S.panelType),'Collettori '+PANEL_TYPES[S.panelType].n.toLowerCase(),{width:13});
  doc.p('Tipologie di serbatoi di accumulo:');
  doc.bul(Object.values(TANK_TYPES).map(p=>`**${p.n}:** ${p.d}`));
  doc.fig(figTank(S.tankType),'Serbatoio '+TANK_TYPES[S.tankType].n.toLowerCase()+' con i circuiti collegati',{width:11});
  doc.h1('4. Metodologie di regolazione');
  doc.p('La regolazione deve sfruttare al massimo l’energia solare e ridurre l’intervento della caldaia. I sistemi di emissione a bassa temperatura migliorano l’efficienza complessiva.');
  doc.h2('4.1 Regolazione del circuito primario').p(REGS.prim.d);
  doc.fig(figCtrl({Tc:62,Tb:40,on:true}),'Regolazione differenziale: con ΔT = 22 K la centralina tiene accesa la pompa',{width:13});
  doc.h2('4.2 Impianto combinato con serbatoio tank in tank').p(REGS.tit.d);
  doc.fig(figSchema({st:SCEN.debole,nums:false}),'Tank in tank con sole debole: il solare preriscalda, la caldaia integra la parte alta');
  doc.h2('4.3 Doppio bollitore con valvola deviatrice').p(REGS.dev.d);
  doc.fig(figDev({Ts:38}),'Acqua solare sotto la soglia: la deviatrice la invia al bollitore della caldaia',{width:14});
  doc.h2('4.4 Acqua calda sanitaria con caldaia integrativa').p(REGS.acs.d);
  doc.fig(figTank('ds',{Ttop:40,Tbot:32,boil:1,heat:0}),'Bollitore a doppio serpentino con integrazione della caldaia',{width:11});
  doc.h1('5. Analisi dei guasti tipici e interventi manutentivi');
  doc.p('Per ogni guasto si riportano sintomo, modalità di verifica, causa e interventi correttivi e preventivi.');
  doc.table([['Guasto','Sintomo','Intervento correttivo','Intervento preventivo'],...faults.map(f=>[f.n,f.sint,f.corr,f.prev])],{widths:[1.4,2,2,2],align:['left','left','left','left'],cap:'Quadro riassuntivo dei guasti'});
  faults.forEach((f,i)=>{doc.h2(`5.${i+1} ${f.n}`);doc.bul([`**Sintomo:** ${f.sint}`,`**Verifica:** ${f.ver}`,`**Causa:** ${f.causa}`,`**Intervento correttivo:** ${f.corr}`,`**Intervento preventivo:** ${f.prev}`]);
    doc.fig(figSchema({fault:f.k,hi:f.comp,nums:false,title:'GUASTO: '+f.n}),f.n+': come si presenta sull’impianto',{width:12})});
  doc.h1('6. Programmazione dei controlli periodici e diagramma di Gantt');
  doc.p(`Per garantire il corretto funzionamento dell’impianto nel suo ciclo di vita si programma un controllo periodico composto da ${acts.length} attività eseguite in sequenza. Ogni attività inizia quando termina la precedente (Inizio = Fine precedente, Fine = Inizio + Durata).`);
  doc.table([["ATTIVITÀ MANUTENTIVA",'INIZIO (min)','DURATA (min)','FINE INT. (min)'],...R.map(r=>[r.n,String(r.s),String(r.d),String(r.e)]),['Durata totale','',String(tot),`${tot} min = ${f1(tot/60)} h`]],{widths:[3,1,1,1.3],total:true,cap:`Cronoprogramma del controllo periodico (durata totale ${tot} minuti, ${f1(tot/60)} ore)`});
  doc.fig(figGantt(acts,{excel:S.excelOrder}),'Diagramma di Gantt del controllo periodico');
  doc.h2('Fasi operative');
  doc.table([['Attività','Modalità esecutiva','Strumenti','Frequenza'],...acts.map(a=>[a.n,a.mod,a.str,a.freq])],{widths:[1.6,3,1.6,.9],align:['left','left','left','center'],cap:'Descrizione delle fasi operative'});
  doc.p('Prima di iniziare: impianto in sicurezza (pompa e caldaia ferme, collettori freddi o coperti, lavoro nelle ore fresche), DPI e dispositivi anticaduta per l’accesso al tetto. Al termine: ripristino della pressione, verifica della ripartenza della pompa con il sole e compilazione del libretto di impianto.');
  return doc;
}

function rng(k,label,min,max,step,unit='',dec=0){return `<div class="ctrl"><label>${label}<b id="v_${k}">${fmt(S[k],dec)} ${unit}</b></label><input type="range" data-k="${k}" data-dec="${dec}" data-unit="${unit}" min="${min}" max="${max}" step="${step}" value="${S[k]}"></div>`}

function num(k,label,min,max,step){return `<div class="ctrl"><label>${label}</label><input type="number" data-k="${k}" min="${min}" max="${max}" step="${step}" value="${S[k]}"></div>`}
function opt(k,list){return `<div class="opts" style="margin:6px 0">${list.map(([v,t,s])=>`<button class="opt ${String(S[k])===String(v)?'sel':''}" data-set="${k}" data-val="${v}">${t}${s?`<small>${s}</small>`:''}</button>`).join('')}</div>`}
function calc(lines,res){return `<div class="calc">${lines.map(l=>`<div class="f">${l}</div>`).join('')}${res?`<div class="res">${res}</div>`:''}</div>`}

function render(){
  if(!S.ex){home();save();return}
  const EX=EXS[S.ex],st=EX.steps[S.step],D=EX.compute();
  $('#ttl').innerHTML=`${EX.title}<small>Fase ${S.step+1} di ${EX.steps.length}</small>`;
  $('#pills').innerHTML=EX.steps.map((s,i)=>`<button class="${i===S.step?'cur':S.done[S.ex+i]?'done':''}" data-go="${i}">${i+1}. ${s.t}</button>`).join('');
  const body=st.report?reportUI(EX):`<div id="ctrl">${st.ctrl(D)}</div><div id="out">${st.out(D)}</div>`;
  $('#main').innerHTML=`<div class="card"><div class="head"><span class="n">${S.step+1}</span><div><h2>${st.t}</h2><p>${st.sub||''}</p></div></div>${body}</div>

  save();
}

async function exportDocx(){
  const busy=document.createElement('div');busy.className='busy';busy.textContent='Preparo la relazione…';document.body.appendChild(busy);
  try{const doc=await EXS[S.ex].report();const blob=await buildDocx(doc,m=>busy.textContent=m);window.__lastDocx=blob;
    const nm=(S.studente||'').trim().replace(/\s+/g,'_').replace(/[^\w-]/g,'');
    download(blob,`Relazione_${S.ex==='dim'?'Traccia1_dimensionamento':'Traccia2_diagnostica'}${nm?'_'+nm:''}.docx`)}
  catch(e){alert('Errore nella creazione del file: '+e.message);console.error(e)}
  busy.remove();
}
function exportXlsx(){const blob=buildGanttXlsx(actsOn(),'DIAGRAMMA DI GANTT - Controllo periodico impianto solare termico',!S.excelOrder);window.__lastXlsx=blob;download(blob,'Diagramma_di_Gantt_pannelli_solari.xlsx')}

// ===================== EVENTI =====================
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.act!=null&&t.dataset.f==='d'){const v=parseFloat(t.value);if(!isNaN(v)&&v>0){S.acts[+t.dataset.act].d=v;refreshOut()}return}
  if(t.dataset.k){const k=t.dataset.k;if(t.type==='text'){S[k]=t.value;save();return}
    const v=parseFloat(t.value);if(isNaN(v))return;S[k]=v;const lb=$('#v_'+k);if(lb)lb.textContent=fmt(v,+t.dataset.dec||0)+' '+(t.dataset.unit||'');
    if(t.dataset.full)render();else refreshOut()}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.tagName==='SELECT'&&t.dataset.k){S[t.dataset.k]=t.value;if(t.dataset.k==='loc'){S.coef=ZONE[LOC[t.value].zona].small[0]}render()}
  if(t.dataset.chk){S[t.dataset.chk][t.dataset.id]=t.checked;render()}
  if(t.dataset.chk1){S[t.dataset.chk1]=t.checked;refreshOut()}
  if(t.dataset.act!=null&&t.dataset.f==='inc'){S.acts[+t.dataset.act].inc=t.checked;render()}
});
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-comp]');if(!b)return;
  if(b.dataset.ex){S.ex=b.dataset.ex;S.step=0;return render()}
  if(b.id==='homeBtn'){S.ex=null;return render()}
  if(b.dataset.go!=null)return go(+b.dataset.go);
  if(b.id==='next')return go(S.step+1);
  if(b.id==='prev'){if(S.step===0){S.ex=null;return render()}return go(S.step-1)}
  if(b.id==='docBtn')return exportDocx();
  if(b.id==='xlsBtn')return exportXlsx();
  if(b.dataset.comp){e.preventDefault();S.comp=b.dataset.comp;return render()}
  if(b.dataset.mv!=null){const i=+b.dataset.mv,j=i+(+b.dataset.dir);if(j>=0&&j<S.acts.length){[S.acts[i],S.acts[j]]=[S.acts[j],S.acts[i]]}return render()}
  if(b.dataset.set){const k=b.dataset.set;let v=b.dataset.val;if(v!==''&&!isNaN(+v))v=+v;S[k]=v;
    if(k==='insMat')S.lam=INS_MAT[v].l;if(k==='orient')S.rows=1;
    if(k==='fault'){S.comp=FAULTS.find(f=>f.k===v).comp}
    return render()}
});
render();
</script></body></html>
